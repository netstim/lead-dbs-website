# Runs the site checks on every pull request (the Pages workflow runs them again on main before it deploys).
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Hugo (checked against the release's checksums)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -O "$base/$deb" -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "$deb"
      - name: Design tokens (.github/scripts/check-design.py)
        run: python3 .github/scripts/check-design.py
      - name: Build
        run: hugo --gc --minify
      - name: Links, redirects and page names (.github/scripts/check-site.py)
        run: python3 .github/scripts/check-site.py public https://www.lead-dbs.org/
      - name: Copy (.github/scripts/check-copy.py)
        run: python3 .github/scripts/check-copy.py public
      - name: Preview build (the GitHub Pages variant)
        run: HUGO_PARAMS_PREVIEW=true hugo --gc --minify --baseURL https://netstim.github.io/lead-dbs-website/ --destination "$RUNNER_TEMP/preview"
      - name: Unused CSS (.github/scripts/check-css-used.py)
        run: python3 .github/scripts/check-css-used.py public "$RUNNER_TEMP/preview"
