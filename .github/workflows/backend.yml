# The server side, on every pull request and weekly: the contact/FOCUS form handler, the analytics collector and
# its operations job, the importers, tools/deploy.py and server/apache/htaccess on a local Apache. Here no test
# may be skipped: LEAD_REQUIRE_INTEGRATION=1 turns a missing PHP, Composer dependency, Apache or Hugo into a
# failure (tests/prerequisites.py). The weekly run catches a new advisory for a locked Composer dependency
# without waiting for a pull request. Nothing here talks to the live server or needs its credentials.
name: Backend

on:
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      LEAD_REQUIRE_INTEGRATION: "1"
    steps:
      # the full history: the deploy tests build the site, whose last-modified dates come from git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install PHP (CLI, SQLite, mbstring), Composer and Apache
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring composer apache2 openssl
      # what server/forms/README.md and server/analytics/README.md require of the host
      - name: PHP 8.2+, mbstring, pdo_sqlite, SQLite 3.35+ (RETURNING)
        run: |
          php -r 'echo "PHP ", PHP_VERSION, "\n"; exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'
          for ext in mbstring pdo_sqlite; do php -m | grep -qix "$ext" || { echo "PHP extension $ext is missing"; exit 1; }; done
          php -r '$v = (new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn(); echo "SQLite $v\n"; exit(version_compare($v, "3.35.0", ">=") ? 0 : 1);'
      - name: Install Hugo (checked against the release's checksums)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -O "$base/$deb" -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "$deb"
      - name: The importers' packages (tools/requirements-import.txt, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary :all: -r tools/requirements-import.txt
      # the lock file must match composer.json, and no locked package may have a published advisory
      - name: Composer lock file and advisories
        working-directory: server/analytics
        run: |
          composer validate --no-check-publish --no-check-all
          composer audit --locked --no-dev
      - name: Install the locked collector dependencies
        working-directory: server/analytics
        run: composer install --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: PHP syntax
        run: for f in server/forms/*.php server/analytics/*.php tests/php/*.php; do php -l "$f"; done
      - name: Collector assertions (tests/php/collector.php)
        run: php tests/php/collector.php
      - name: Every Python test, none skipped
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v'
