# Builds the site and publishes it as a preview on GitHub Pages
# (https://netstim.github.io/lead-dbs-website/) with an "under construction" banner and noindex.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild, so the "next event" (data/events.yaml) and every date that depends on the
  # build day stay current without a push. 02:17 UTC, off the full hour that most jobs share.
  # GitHub pauses scheduled runs after 60 days without activity in the repository: see README, Events.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      # the full history: each page's last-modified date comes from git (hugo.toml, enableGitInfo)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Hugo (checked against the release's checksums)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -O "$base/$deb" -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "$deb"
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          HUGO_PARAMS_PREVIEW: "true"
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Fails the run on a broken internal link, image or #anchor, a redirect to nowhere, a relative
      # canonical, og:image or sitemap address, or front matter shown as page text
      # (.github/scripts/check-site.py says what it checks).
      - name: Check the preview build
        run: python3 .github/scripts/check-site.py public "${{ steps.pages.outputs.base_url }}/"
      - name: Check a production build (https://www.lead-dbs.org/)
        run: |
          hugo --gc --minify --destination "$RUNNER_TEMP/production"
          python3 .github/scripts/check-site.py "$RUNNER_TEMP/production" https://www.lead-dbs.org/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
