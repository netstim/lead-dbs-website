# Builds the site and publishes it as a preview on GitHub Pages
# (https://netstim.github.io/lead-dbs-website/) with an "under construction" banner and noindex.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild, so the "next event" (data/events.yaml) and every date that depends on the
  # build day stay current without a push. 02:17 UTC, off the full hour that most jobs share.
  # GitHub pauses scheduled runs after 60 days without activity in the repository: see docs/editing.md, Events.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      PLAYWRIGHT_VERSION: 1.48.2
    steps:
      # the full history: each page's last-modified date comes from git (hugo.toml, enableGitInfo)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Hugo (checked against the release's checksums)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -O "$base/$deb" -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "$deb"
      - name: Design tokens
        run: python3 .github/scripts/check-design.py
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        env:
          HUGO_PARAMS_PREVIEW: "true"
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Fails the run on a broken internal link, image or #anchor, a redirect to nowhere, a canonical or
      # og:url that is not the page's live address, a relative og:image or sitemap address, or front matter
      # shown as page text (.github/scripts/check-site.py says what it checks).
      - name: Check the preview build
        run: python3 .github/scripts/check-site.py public "${{ steps.pages.outputs.base_url }}/"
      - name: Check a production build (https://www.lead-dbs.org/)
        run: |
          hugo --gc --minify --destination "$RUNNER_TEMP/production"
          python3 .github/scripts/check-site.py "$RUNNER_TEMP/production" https://www.lead-dbs.org/
      - name: Copy
        run: python3 .github/scripts/check-copy.py public
      - name: Unused CSS
        run: python3 .github/scripts/check-css-used.py public "$RUNNER_TEMP/production"
      # the same browser check as on pull requests (checks.yml), so nothing is deployed that it would fail
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright and Chromium
        run: npm install --no-save "playwright@$PLAYWRIGHT_VERSION" && npx playwright install --with-deps chromium
      - name: Pages in the browser (.github/scripts/check-browser.mjs)
        run: node .github/scripts/check-browser.mjs "$RUNNER_TEMP/production" https://www.lead-dbs.org/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only the deploy job can publish; the build job runs third-party code (npm, Hugo) with read access only
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
