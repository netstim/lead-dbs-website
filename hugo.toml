baseURL = "https://www.lead-dbs.org/"
title = "Lead-DBS"
locale = "en"
enableRobotsTXT = true
# Old WordPress URLs end in a slash; keep them identical so links in papers keep working.
uglyURLs = false
disableKinds = ["taxonomy", "term"]
# A page's last-modified date (sitemap, JSON-LD, the "updated" line of a background article): its front
# matter lastmod when it has one, otherwise the date of the last commit that changed its file, so it is
# never the build day. The Pages workflow checks out the full history for this.
enableGitInfo = true
[frontmatter]
  lastmod = ["lastmod", ":git", "modified", "date", "publishDate"]

# Files of a page (images, PDFs) are published only when a template or the Markdown uses them
# (a picture shown resized does not ship its unused original twice).
[[cascade]]
  [cascade.build]
    publishResources = false

# The site search: Hugo writes /search-index.json (layouts/home.searchindex.json); assets/js/search.js reads it.
[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true
  permalinkable = false
[outputs]
  home = ["html", "searchindex"]
  section = ["html"]
  page = ["html"]
  # The news feed is /news/index.xml (content/news/_index.md sets outputs: html, rss); the old
  # WordPress feeds /feed/ and /news/feed/ point to it.

[params]
  description = "Lead-DBS: an open-source toolbox for deep brain stimulation electrode localization, stimulation modelling and connectomic imaging from postoperative MRI and CT."
  # Forms have no backend yet: production shows each form's offline line (data/forms.yaml),
  # the preview the form disabled with a note. Set true once the forms have an action.
  formsEnabled = false
  # Preview deployments (GitHub Pages) set this to true: shows an "under construction"
  # banner, adds noindex, and points canonical URLs at the live site.
  preview = false
  liveSite = "https://www.lead-dbs.org"
  # The source code, linked from the header of every page.
  github = "https://github.com/netstim/leaddbs"
  # Doc pages show "On this page" from this many ## sections.
  tocMinHeadings = 3

[permalinks.page]
  # News posts lived at the site root in WordPress (/lead-dbs-3-0-out-now/).
  news = "/:slug/"

[pagination]
  pagerSize = 10

[services.rss]
  limit = 20

[markup.goldmark.renderer]
  unsafe = true # a few imported pages contain raw HTML
[markup.goldmark.parser.attribute]
  block = true
[markup.goldmark.renderHooks.image]
  useEmbedded = "fallback"
[markup.goldmark.renderHooks.link]
  useEmbedded = "fallback"

[privacy.youtube]
  privacyEnhanced = true
[privacy.vimeo]
  enableDNT = true

[menus]
  # The main menu, grouped by what visitors come for. Each word's label is also the page's linkTitle
  # (breadcrumb, footer, search), so a page has one name everywhere. The entry with params.role
  # "action" (identifier "download") is drawn as the header's button ("Download Lead-DBS"), not as a
  # menu word; the one with params.role "sheet-word" (identifier "manual") is also a first-level word of
  # the phone sheet. Templates find these two by identifier and role, never by their label, so either
  # label can be renamed. The footer lists the same groups.
  # The menu is also the site's one hierarchy: breadcrumbs and the sidebar's section list follow it,
  # not the folders (layouts/_partials/nav-place.html). A page that is not in the menu belongs to the
  # entry of its nearest folder that is, or to the page named by its front matter "menuParent".
  [[menus.main]]
    name = "Methods"
    pageRef = "/helpsupport/knowledge-base/lead-dbs-methods"
    identifier = "features"
    weight = 1
  [[menus.main]]
    name = "Docs"
    pageRef = "/helpsupport"
    identifier = "docs"
    weight = 2
    [menus.main.params]
      # the word in the header's bar (the full name stays everywhere else: breadcrumbs, the band, the sheet's captions)
      short = "Docs"
  [[menus.main]]
    name = "Atlases and data"
    pageRef = "/helpsupport/knowledge-base/atlasesresources"
    identifier = "data"
    weight = 3
    [menus.main.params]
      # the word in the header's bar (the full name stays everywhere else: breadcrumbs, the band, the sheet's captions)
      short = "Atlases"
  [[menus.main]]
    name = "Community"
    pageRef = "/community"
    identifier = "community"
    weight = 4
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 5
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    identifier = "about"
    weight = 6
  [[menus.main]]
    name = "Download"
    pageRef = "/download"
    identifier = "download"
    weight = 7
    [menus.main.params]
      # drawn as the header's button, not as a menu word (layouts/_partials/header.html)
      role = "action"

  # Methods: what the software does. The group's own page (the word "Methods") is the overview: every
  # capability with its name, a picture, its manual chapter and papers, in four numbered chapters. The
  # panel lists those chapters first: the anchors of the page (entries with url, not pages; params.panelOnly
  # keeps them out of the sidebar of the group's articles, where they would read as pages), and for the
  # operating theatre, whose chapter is the one tool Lead-OR, its page. Then under a caption
  # (params.divider) the articles that explain a method in depth, then the figures made with Lead-DBS.
  [[menus.main]]
    parent = "features"
    name = "Single patients"
    url = "/helpsupport/knowledge-base/lead-dbs-methods/#single-patients"
    weight = 1
    [menus.main.params]
      card = "Electrode localization and stimulation modelling"
      panelOnly = true
  [[menus.main]]
    parent = "features"
    name = "Groups of patients"
    url = "/helpsupport/knowledge-base/lead-dbs-methods/#groups-of-patients"
    weight = 2
    [menus.main.params]
      card = "Cohort analyses and clinical outcomes"
      panelOnly = true
  [[menus.main]]
    parent = "features"
    name = "Lead-OR"
    pageRef = "/about/lead-or"
    weight = 3
    [menus.main.params]
      card = "Recordings and stimulation during surgery"
  [[menus.main]]
    parent = "features"
    name = "Tools and modules"
    url = "/helpsupport/knowledge-base/lead-dbs-methods/#tools"
    weight = 4
    [menus.main.params]
      card = "Lead Group, Lead Connectome, OSS-DBS and Lead Tutor"
      panelOnly = true
  [[menus.main]]
    parent = "features"
    name = "DBS network mapping"
    pageRef = "/helpsupport/knowledge-base/lead-dbs-methods/connectivity-benefit-mapping"
    weight = 5
    [menus.main.params]
      card = "Connectivity and clinical outcomes"
      # a line above the entry, with this caption over the entries from here on
      divider = "In depth"
  [[menus.main]]
    parent = "features"
    name = "Subcortical electrophysiology mapping"
    pageRef = "/helpsupport/knowledge-base/lead-dbs-methods/subcortical-electrophysiology-mapping-sem"
    weight = 6
    [menus.main.params]
      card = "Electrophysiology in template space"
  [[menus.main]]
    parent = "features"
    name = "AC/PC to MNI conversion"
    pageRef = "/helpsupport/knowledge-base/lead-dbs-methods/acpc-to-mni-conversion-2"
    weight = 7
    [menus.main.params]
      card = "Convert between AC/PC and MNI coordinates"
  [[menus.main]]
    parent = "features"
    name = "Made with Lead-DBS"
    pageRef = "/gallery"
    weight = 9
    [menus.main.params]
      card = "3D renders and published figures"
      # a line above the entry, without a caption
      divider = true

  # Docs: the documentation (the manual is integrated at /manual/) and the one list of where to ask
  # (/helpsupport/#get-help; the contact page sits under it through its front matter menuParent)
  [[menus.main]]
    parent = "docs"
    name = "First steps"
    pageRef = "/helpsupport/first-steps"
    weight = 1
    [menus.main.params]
      card = "Installation and electrode localization"
  [[menus.main]]
    parent = "docs"
    name = "Manual"
    pageRef = "/manual"
    identifier = "manual"
    weight = 2
    [menus.main.params]
      # also a first-level word of the phone sheet, right under its group (layouts/_partials/header.html)
      role = "sheet-word"
      card = "Installation, workflows and reference"
      # printed on the hub's card for the manual (pages bring their own front matter description)
      description = "Installation guides, analysis workflows and software reference."
      # words the site search finds it by
      keywords = "documentation docs manual handbook guide installation install how to"
  [[menus.main]]
    parent = "docs"
    name = "Practice dataset (Lead Tutor)"
    pageRef = "/helpsupport/learn-lead-dbs-yourself"
    weight = 3
    [menus.main.params]
      card = "10 patients with expert localizations"
      indexTitle = "Lead Tutor"
  [[menus.main]]
    parent = "docs"
    name = "Walkthrough videos"
    pageRef = "/helpsupport/knowledge-base/walkthrough-videos"
    weight = 4
    [menus.main.params]
      card = "Tutorials and recorded workshops"
  [[menus.main]]
    parent = "docs"
    name = "Get help"
    url = "/helpsupport/#get-help"
    weight = 6
    [menus.main.params]
      card = "User support and bug reports"
      description = "User support, bug reports and contact details."
  [[menus.main]]
    parent = "docs"
    name = "Contact"
    pageRef = "/contact"
    weight = 7
    [menus.main.params]
      card = "Write to the Lead-DBS team"

  # Atlases and data: the three catalogues, then (after a captioned line: params.divider) the two
  # atlases the Lead-DBS team made, then the background article on the MNI spaces
  [[menus.main]]
    parent = "data"
    name = "Subcortical atlases"
    pageRef = "/helpsupport/knowledge-base/atlasesresources/atlases-2"
    weight = 1
    [menus.main.params]
      card = "Atlases by structure and disease"
  [[menus.main]]
    parent = "data"
    name = "Cortical parcellations"
    pageRef = "/helpsupport/knowledge-base/atlasesresources/cortical-atlas-parcellations-mni-space"
    weight = 2
    [menus.main.params]
      card = "Parcellations for connectivity analyses"
  [[menus.main]]
    parent = "data"
    name = "Normative connectomes"
    pageRef = "/helpsupport/knowledge-base/atlasesresources/normative-connectomes"
    weight = 3
    [menus.main.params]
      card = "Structural and functional connectivity datasets"
  [[menus.main]]
    parent = "data"
    name = "DISTAL atlas"
    pageRef = "/helpsupport/knowledge-base/atlasesresources/distal-atlas"
    weight = 4
    [menus.main.params]
      card = "Subcortical anatomy and functional subdivisions"
      divider = "By the Lead-DBS team"
  [[menus.main]]
    parent = "data"
    name = "FOCUS atlas"
    pageRef = "/helpsupport/knowledge-base/atlasesresources/focus-atlas"
    weight = 5
    [menus.main.params]
      card = "7T MRI anatomy and fibre pathways"
  [[menus.main]]
    parent = "data"
    name = "About the MNI spaces"
    pageRef = "/helpsupport/knowledge-base/atlasesresources/about-the-mni-spaces"
    weight = 6
    [menus.main.params]
      card = "Template versions and coordinate spaces"
      divider = "Background"

  # Community (the past workshops sit under Events: front matter menuParent)
  [[menus.main]]
    parent = "community"
    name = "Events"
    pageRef = "/events"
    weight = 1
    [menus.main.params]
      card = "Workshops and developer meetings"
  [[menus.main]]
    parent = "community"
    name = "User Slack"
    pageRef = "/helpsupport/slack-user-channel"
    weight = 2
    [menus.main.params]
      card = "Support and development discussions"
  [[menus.main]]
    parent = "community"
    name = "Contribute"
    pageRef = "/develop"
    weight = 3
    [menus.main.params]
      card = "Code, data and bug reports"
  [[menus.main]]
    parent = "community"
    name = "Newsletter"
    pageRef = "/subscribe-to-our-newsletter"
    weight = 4
    [menus.main.params]
      card = "Release and workshop announcements"

  # About: who makes Lead-DBS, how to cite it, its papers, the software it builds on
  [[menus.main]]
    parent = "about"
    name = "Cite Lead-DBS"
    pageRef = "/about/citing_leaddbs"
    weight = 1
    [menus.main.params]
      card = "Citations and methods text"
  [[menus.main]]
    parent = "about"
    name = "Publications"
    pageRef = "/about/publications"
    weight = 2
    [menus.main.params]
      card = "Methods papers and studies using Lead-DBS"
  [[menus.main]]
    parent = "about"
    name = "Contributors"
    pageRef = "/about/team"
    weight = 3
    [menus.main.params]
      card = "Core team and project contributors"
  [[menus.main]]
    parent = "about"
    name = "Dependencies"
    pageRef = "/about/lead-dbs-dependencies"
    weight = 4
    [menus.main.params]
      card = "Software libraries and citations"

  # The footer's legal line (Contact is in the footer's "Help" column and under "Get help")
  [[menus.footer]]
    name = "Imprint"
    pageRef = "/impressum-datenschutzerklarung"
    weight = 1
  [[menus.footer]]
    name = "Privacy policy"
    pageRef = "/privacy-policy"
    weight = 2

# static/gallery/ is also read as assets, so the gallery page can resize its figures.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "static/gallery"
  target = "assets/gallery"
# the logo, so templates can make small copies of it
[[module.mounts]]
  source = "static/images/logo.png"
  target = "assets/logo/logo.png"
