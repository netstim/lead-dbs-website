  preinstalled: true
  about: |-
    A set of tractograms generated by targeted tractography describing the main trajectories of some subcortical white matter pathways. These trajectories represent:

    1. The thalamocortical system from the associative (Brodmann areas 8, 9, 10, 46, and 47) and limbic cortical regions (Brodmann areas 11, 12, and 32, ventral part of areas 24 and 25) [1] to the thalamus [2–5].
    2. The Mesocorticolimbic system. Connections of the associative (Brodmann areas 8, 9, 10, 46, and 47) and limbic cortical regions (Brodmann areas 11, 12, and 32, ventral part of areas 24 and 25) to the midbrain nuclei: substantia nigra compacta and reticulata and the ventral tegmental area [2–5].
    3. The cerebellothalamic system concerning the motor circuit from the cerebellar nuclei to the ventral intermediate nucleus [7].

    These tractograms were generated using the IT Human template [8]
