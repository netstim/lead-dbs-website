- id: computational-brain-anatomy-lab-merged-atlas-cobralab-atlas-in-mni-space-pipitone-2014
  group: basal-ganglia
  name: CoBrALab merged atlas
  ref: Pipitone 2014
  covers: Striatum, pallidum, thalamus, amygdala, hippocampus
  preinstalled: true
  about: The CoBrALab produces manually segmented MNI-based atlases of brain anatomy on their 5 high-resolution (0.3 mm isotropic) T1 and T2 templates for use with their registration-based [segmentation pipeline MAGeTbrain](https://github.com/CoBrALab/MAGetBrain). In order to enable usage of their atlases for common-space localization in MNI space, they applied the MAGeTbrain pipeline to all publicly available MNI space templates in order to provide MNI space localization. These atlases contain the thamalus, globlus paladus, striatum, hippocampus with its subfields and whitematter, and the amydalaya.
  get:
  - 'Information and download: [CoBrALab MNI models on GitHub](https://github.com/CobraLab/atlases/tree/master/mni_models)'
  cite:
  - 'Multi-atlas segmentation of the whole hippocampus and subfields using multiple automatically generated templates. (2014). Multi-atlas segmentation of the whole hippocampus and subfields using multiple automatically generated templates., *101*, 494–512. [doi:10.1016/j.neuroimage.2014.04.054](https://doi.org/10.1016/j.neuroimage.2014.04.054)'
  - 'Chakravarty, M. M., Steadman, P., van Eede, M. C., Calcott, R. D., Gu, V., Shaw, P., et al. (2012). Performing label-fusion-based segmentation using multiple automatically generated templates. *Human Brain Mapping*, *34*(10), 2635–2654. [doi:10.1002/hbm.22092](https://doi.org/10.1002/hbm.22092)'
  - 'Amygdala label: A reliable protocol for the manual segmentation of the human amygdala and its subregions using ultra-high resolution MRI. (2012). A reliable protocol for the manual segmentation of the human amygdala and its subregions using ultra-high resolution MRI., *60*(2), 1226–1235. [doi:10.1016/j.neuroimage.2011.12.073](https://doi.org/10.1016/j.neuroimage.2011.12.073)'
  - 'More: [CoBrALab amygdala atlas on GitHub](https://github.com/CobraLab/atlases/tree/master/amygdala)'
  - 'Striatum, pallidum and thamalus: Warping an atlas derived from serial histology to 5 high-resolution MRIs. (2018). Warping an atlas derived from serial histology to 5 high-resolution MRIs., *5*, 180107. [doi:10.1038/sdata.2018.107](https://doi.org/10.1038/sdata.2018.107)'
  - 'More: [CoBrALab 5-atlas subcortical on GitHub](https://github.com/CobraLab/atlases/tree/master/5-atlas-subcortical)'
  - 'Hippocampus subfields: A novel in vivo atlas of human hippocampal subfields using high-resolution 3 T magnetic resonance imaging. (2013). A novel in vivo atlas of human hippocampal subfields using high-resolution 3 T magnetic resonance imaging., *74*, 254–265. [doi:10.1016/j.neuroimage.2013.02.003](https://doi.org/10.1016/j.neuroimage.2013.02.003)'
  - 'More: [CoBrALab hippocampus subfields on GitHub](https://github.com/CobraLab/atlases/tree/master/hippocampus-subfields)'
  - 'Hippocampus / other: Manual segmentation of the fornix, fimbria, and alveus on high-resolution 3T MRI: Application via fully-automated mapping of the human memory circuit white and grey matter in healthy and pathological aging. (2018). Manual segmentation of the fornix, fimbria, and alveus on high-resolution 3T MRI: Application via fully-automated mapping of the human memory circuit white and grey matter in healthy and pathological aging., *170*, 132–150. [doi:10.1016/j.neuroimage.2016.10.027](https://doi.org/10.1016/j.neuroimage.2016.10.027)'
  - 'More: [CoBrALab hippocampus subfields on GitHub](https://github.com/CobraLab/atlases/tree/master/hippocampus-subfields)'
  image: Cobralab-1.png
  alt: 'CoBrALab atlas: subcortical structures in 3D'
- id: enhanced-tissue-probability-maps-lorio-2016
  group: basal-ganglia
  name: Enhanced tissue probability maps
  ref: Lorio 2016
  covers: Tissue priors for subcortical segmentation
  preinstalled: true
  about: The enhanced Tissue Probability Maps are a set of gray-, white- and csf- priors for segmentation of subcortical structures using SPM based on manual labelling of iron and myelin specific parameter maps of nearly 100 individuals aged 25-75yo. Not specifically a subcortical atlas (with strict boundaries for each nucleus), they are still a highly valuable source for patient-specific segmentation and normalization with specific focus on the subcortex. Lead-DBS uses the TPMs to generate customized space-specific TPMs for each “space” that you use (for instance, a TPM for the default ICBM 2009b NLIN Asym space is generated based on the Lorio et al. enhances TPMs).
  get:
  - 'Information and download: [enhanced TPMs at LREN, Lausanne](https://www.unil.ch/lren/home/menuinst/teaching--utilities/data--utilities.html)'
  - As mentioned above, the TPM is used as a fundamental building block in Lead-DBS.
  cite:
  - 'Lorio, S., Fresard, S., Adaszewski, S., Kherif, F., Chowdhury, R., Frackowiak, R. S., et al. (2016). New tissue priors for improved automated classification of subcortical brain structures on MRI. *NeuroImage*, *130*, 157–166. [doi:10.1016/j.neuroimage.2016.01.062](https://doi.org/10.1016/j.neuroimage.2016.01.062)'
  image: Bildschirmfoto-2019-03-07-um-08.32.29.png
  alt: 'Enhanced tissue probability maps: coronal slice of the template'
- id: ultra-high-field-atlas-for-dbs-planning
  group: basal-ganglia
  name: Ultra-high field atlas for DBS planning
  ref: Wang 2016
  covers: STN, pallidum, red nucleus from 7T MRI
  preinstalled: true
  about: Atlas including STN, pallidum and red nucleus made on 7T data from 12 healthy controls. The templates on which the atlas is defined is not in MNI space but can be used within Lead-DBS for normalizations, as well (instead of using an MNI template). Also, there is an MNI version ported from template to MNI space available within Lead-DBS.
  get:
  - An MNI version of the atlas comes preinstalled within Lead-DBS
  - Original 7T template space atlases and templates can be downloaded via the Lead-DBS spaces menu, as well
  - 'Raw data: [deepbrain7t on NITRC](https://www.nitrc.org/projects/deepbrain7t/)'
  cite:
  - 'Wang, B. T., Poirier, S., Guo, T., Parrent, A. G., Peters, T. M., & Khan, A. R. (2016).  Generation and evaluation of an ultra-high-field atlas with applications in DBS planning. *SPIE Medical Imaging*, *9784*, 97840H–97840H–10. http://doi.org/10.1117/12.2217126. [SPIE](http://proceedings.spiedigitallibrary.org/proceeding.aspx?articleid=2506160)'
  image: 7twang-1-300x236.png
  alt: 'Ultra-high field atlas: subcortical structures in 3D'
- id: atlas-of-the-basal-ganglia-and-thalamus-abgt
  group: basal-ganglia
  name: Atlas of the Basal Ganglia and Thalamus (ABGT)
  ref: He 2020
  covers: Basal ganglia and thalamus, structural and functional
  preinstalled: true
  about: This atlas was generated in a hybrid manner using both structural and functional information. Components of the basal ganglia were first defined structurally with the “[atlas of the basal ganglia](https://www.nitrc.org/projects/atag/)” ([ATAG](https://www.nitrc.org/projects/atag/); Keuken et al., 2014), including the striatum, globus pallidus externus (GPe) and internus (GPi), subthalamic nucleus (STN), and substantia nigra (SN). We also localized the spatial extent of the thalamus based on the Morel atlas (Morel et al., 1997; Krauth et al., 2010). Due to the relatively small size of the GPi, GPe, STN, and SN, these components were kept in consistent with ATAG without any additional processing. For the striatum and thalamus, we then performed a masked independent component analysis (ICA) based functional parcellation (Moher Alsady et al., 2016) to divide them into functionally distinctive subdivisions.
  get: []
  cite:
  - 'He, X., Chaitanya, G., Asma, B., Caciagli, L., Bassett, D. S., Tracy, J. I., & Sperling, M. R. (2020). Disrupted basal ganglia–thalamocortical loops in focal to bilateral tonic-clonic seizures. *Brain : a Journal of Neurology*, *143*(1), 175–190. [doi:10.1093/brain/awz361](https://doi.org/10.1093/brain/awz361)'
  image: He_atlas-1030x730.png
  alt: 'Atlas of the Basal Ganglia and Thalamus: colour-coded parcels in 3D'
- id: morel-atlas
  group: basal-ganglia
  name: Morel atlas
  ref: Morel 2013, Krauth 2010
  covers: Thalamus and basal ganglia from histology
  preinstalled: true
  about: |-
    Histological atlas that has been normalized to MNI-Space.

    Optimal for STN or thalamic targets. In case your DBS target is the ventral intermediate nucleus (VIM), please note that this nucleus (commonly appearing in Walker or Hassler nomenclatures of thalamic nuclei) is not directly represented in this atlas which follows the Jones / Hirai & Jones nomenclatures.

    The VLpv is the nucleus of the atlas best corresponding to the VIM although it may not be exactly the same. For more information about conversions between thalamic nomenclatures e.g. see Paxinos, G. (2012). The Human Nervous System. Academic Press.
  get:
  - The atlas comes pre-installed with Lead-DBS. It has been made [openly available by its authors](https://zenodo.org/records/13918589).
  - 'A surface-based version: [Morel atlas surfaces in the ETH Research Collection](https://www.research-collection.ethz.ch/handle/20.500.11850/669887)'
  cite:
  - 'Generation of Individualized Thalamus Target Maps by Using Statistical Shape Models and Thalamocortical Tractography. A Jakab, R Blanc, E L Berenyi, and G Szekely. AJNR Am J Neuroradiol, 2012 vol. 33 (11) pp. 2110-2116. http://www.ajnr.org/content/33/11/2110.full. [PubMed](http://www.ncbi.nlm.nih.gov/pubmed/22700756)'
  - 'A mean three-dimensional atlas of the human thalamus: Generation from multiple histological data. Axel Krauth, Remi Blanc, Alejandra Poveda, Daniel Jeanmonod, Anne Morel, and Gábor Székely. NeuroImage, 2010 vol. 49 (3) pp. 2053-2062.http://linkinghub.elsevier.com/retrieve/pii/S1053811909011136. [PubMed](http://www.ncbi.nlm.nih.gov/pubmed/19853042)'
  - Morel, A. (2013). Stereotactic Atlas of the Human Thalamus and Basal Ganglia. CRC Press.
  image: Morel-300x172.png
  alt: 'Morel atlas: thalamic and basal ganglia structures of both hemispheres in 3D'
- id: chakravarty-2006-atlas
  group: basal-ganglia
  name: Chakravarty atlas
  ref: Chakravarty 2006
  covers: Basal ganglia and thalamus from histology
  preinstalled: false
  about: |-
    To the best of our knowledge, this atlas is the most detailed subcortical atlas available. Since its structural descriptions are in nomenclature of the Schaltenbrand-Wahren atlas, it also is very relevant to the field of DBS.

    Please note that the original version of this atlas was registered to the MNI colin space whereas Lead-DBS conventionally uses the MNI152 ICBM 2009 space. [These spaces are similar](/about-the-mni-spaces/), but a 2009b version of the same data exists in the DISTAL atlas (see above). Alternatively, the same data was used to create the MNI PD25 atlas – which again uses a slightly different template space based on patients suffering from Parkinson’s Disease (see below).
  get:
  - You can get information about this atlas by contacting the [author](http://cobralab.ca/members/commander/).
  - The histological labels have made their way into both the DISTAL and MNI 25 PD atlases (and build the seminal groundwork for these two atlases)
  cite:
  - 'Chakravarty, M. M., Bertrand, G., Hodge, C. P., Sadikot, A. F., & Collins, D. L. (2006). The creation of a brain atlas for image guided neurosurgery using serial histological data. *NeuroImage*, *30*(2), 359–376. [ScienceDirect](http://www.sciencedirect.com/science/article/pii/S1053811905006993)'
  image: Chakravarty_Atlas-300x300.png
  alt: 'Chakravarty atlas: labelled nuclei outlined on a histological section'
  caption: 2D slice visualization of the atlas
- id: atag-atlas
  group: basal-ganglia
  name: ATAG atlas
  ref: Keuken 2014
  covers: Basal ganglia from 7T MRI
  preinstalled: true
  about: An atlas of the basal ganglia that is based on 7T MR imaging
  get:
  - 'Download: [ATAG on NITRC](https://www.nitrc.org/projects/atag)'
  cite:
  - 'Keuken, M. C., Bazin, P. L., Crown, L., Hootsmans, J., Laufer, A., Müller-Axt, C., et al. (2014). Quantifying inter-individual anatomical variability in the subcortex using 7T structural MRI. *NeuroImage*, *94*, 40–46. doi:10.1016/j.neuroimage.2014.03.032. [PubMed](http://www.ncbi.nlm.nih.gov/pubmed/24650599)'
  image: ATAG_subcortical_atlas-300x293.png
  alt: 'ATAG atlas: subcortical structures in 3D'
