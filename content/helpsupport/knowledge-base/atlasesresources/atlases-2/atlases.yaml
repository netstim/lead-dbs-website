  group: basal-ganglia
  name: Chakravarty atlas
  ref: Chakravarty 2006
  covers: Basal ganglia and thalamus from histology
  preinstalled: false
  about: |-
    A histological subcortical atlas using Schaltenbrand-Wahren nomenclature.

    The original version was registered to the MNI Colin space, whereas Lead-DBS uses the MNI152 ICBM 2009b space. [These spaces are similar](/about-the-mni-spaces/), and a 2009b version of the same data is part of the DISTAL atlas (see above). The same data was also used for the MNI PD25 atlas, which uses a template space built from patients with Parkinson’s disease (see below).
  get:
  - 'Information: from its [author](http://cobralab.ca/members/commander/)'
  - The histological labels are the basis of both the DISTAL and MNI PD25 atlases.
  cite:
  - chakravarty2006
  image: Chakravarty_Atlas-300x300.png
  alt: 'Chakravarty atlas: labelled nuclei outlined on a histological section'
  caption: 2D slice visualization of the atlas
