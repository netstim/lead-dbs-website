  - 'The atlas was migrated from CIT168 space to ICBM 2009b space and comes preinstalled within Lead-DBS. A refined warp was created in 02/20 and resulted in current version v1.1 | older version: v1.0 (separate downloads of these versions are no longer available)'
  cite:
  - 'Pauli, W. M., Nili, A. N., & Tyszka, J. M. (2018). A high-resolution probabilistic in vivo atlas of human subcortical brain nuclei. *Scientific Data*, *5*, 180063. [doi:10.1038/sdata.2018.63](https://doi.org/10.1038/sdata.2018.63)'
  image: bg-1030x592.png
  alt: 'CIT168 atlas: striatum and nearby structures in 3D over a sagittal MRI slice'
- id: mni-pd25-atlas-xiao-2017
