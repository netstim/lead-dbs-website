- id: enhanced-tissue-probability-maps-lorio-2016
  group: basal-ganglia
  name: Enhanced tissue probability maps
  ref: Lorio 2016
  covers: Tissue priors for subcortical segmentation
  preinstalled: true
  about: The enhanced Tissue Probability Maps are a set of gray-, white- and csf- priors for segmentation of subcortical structures using SPM based on manual labelling of iron and myelin specific parameter maps of nearly 100 individuals aged 25-75yo. Not specifically a subcortical atlas (with strict boundaries for each nucleus), they are still a highly valuable source for patient-specific segmentation and normalization with specific focus on the subcortex. Lead-DBS uses the TPMs to generate customized space-specific TPMs for each “space” that you use (for instance, a TPM for the default ICBM 2009b NLIN Asym space is generated based on the Lorio et al. enhances TPMs).
  get:
  - 'Information and download: [enhanced TPMs at LREN, Lausanne](https://www.unil.ch/lren/home/menuinst/teaching--utilities/data--utilities.html)'
  cite:
  - lorio2016
