  about: This atlas builds upon networks associated with optimal responses in patients with Obsessive Compulsive Disorder analysed with DBS fibre filtering (a.k.a. discriminative tractography) method as implemented within Lead-DBS. Building upon a large collective of N = 50 patients from four centers and a normative connectome calculated in 1,000 participants, this atlas differentiates specific bundles associated with optimal response across two different stimulation targets (subthalamic nucleus and anterior limb of the internal capsule). Relevance of the tract for two additional brain targets (bed nucleus of the stria terminalis and internal pallidum) have been indirectly shown, as well (see Baldermann et al., Biological Psychiatry 2022). Optimal fMRI response networks based on Li & Hollunder et al., Biological Psychiatry 2021) are also provided.
