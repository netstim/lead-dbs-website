- id: hips-thomas-segmentation-vidal-2024
  group: thalamus
  name: HIPS-THOMAS segmentation
  ref: Vidal 2024
  covers: Thalamic nuclei in the patient's own space
  preinstalled: false
  included: Run from Lead-DBS
  about: As opposed to the Saranathan THOMAS atlas in MNI space, this is a multi-atlas based parcellation in patient space using a variant of the THOMAS algorithm called Histogram-based polynomial synthesis (HIPS) THOMAS for handling standard T1 MRI data. HIPS algorithm synthesizes WM-nulled like images from T1 before running the standard THOMAS algorithm leveraging the high intrathalamic contrast of WM-nulled contrast. For WMn/FGATIR images, standard THOMAS is directly run.
  get:
  - The atlas will be generated in patient native space by clicking the menu *Tools* -> *Run THOMAS for T1w/WMn/FGATIR* in Lead-DBS.
  cite:
  - 'Vidal, J.P., Danet, L., Péran, P., Pariente, J., Bach Cuadra, M., Zahr, N.M., Barbeau, E.J., Saranathan, M., 2024. Robust thalamic nuclei segmentation from T1-weighted MRI using polynomial intensity transformation. Brain Struct. Funct. [doi:10.1007/s00429-024-02777-5](https://doi.org/10.1007/s00429-024-02777-5)'
  - 'Su, J.H., Thomas, F.T., Kasoff, W.S., Tourdias, T., Choi, E.Y., Rutt, B.K., Saranathan, M. (2019). Thalamus Optimized Multi Atlas Segmentation (THOMAS): fast, fully automated segmentation of thalamic nuclei from structural MRI. NeuroImage 194, 272–282. [doi:10.1016/j.neuroimage.2019.03.021](https://doi.org/10.1016/j.neuroimage.2019.03.021)'
  image: HIPS_THOMAS-300x238.png
  alt: 'HIPS-THOMAS segmentation: thalamic nuclei in 3D over a histological section'
