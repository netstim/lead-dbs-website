  cite:
  - Song‐Lin Ding, Joshua J. Royall, Susan M. Sunkin, Benjamin A.C. Facer, Phil Lesnar, Amy Bernard, Lydia Ng, Ed S. Lein (2020). “Allen Human Reference Atlas – 3D, 2020,” RRID:SCR_017764, version 1.0.0.
  - 'Ding, S.L., Royall, J.J., […], Lein, E.S. Comprehensive cellular‐resolution atlas of the adult human brain. Journal of Comparative Neurology, Volume 524:16, pages 3127–3481, 1 November 2016. [Allen Institute](https://community.brain-map.org/t/allen-human-reference-atlas-3d-2020-new/405)'
