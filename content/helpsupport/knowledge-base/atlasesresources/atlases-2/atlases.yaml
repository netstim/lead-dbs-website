- id: human-motor-thalamus-atlas-ilinsky-2018
  group: thalamus
  name: Human Motor Thalamus atlas
  ref: Ilinsky 2018
  covers: Motor thalamic nuclei from histology
  preinstalled: true
  about: |-
    *By Ilinsky I. and Kultas-Ilinsky H-K.*

    Continuous series of thalamic nuclear maps in three stereotactic planes obtained from a single brain plus the original series of sagittal histological sections and a set of sagittal MRIs from the same brain are available at the site humanmotorthalamus.com.

    In this set of images, the motor-related nuclei are outlined based on an immunocytochemical marker specific for terminal zone of each motor-related subcortical afferent system such as cerebellar, pallidal and nigral. These territories are shown within the Talairach coordinate system and their correspondence to Hassler’s parcellations of the motor related nuclei as well as Jones-Morel outlines is discussed in an accompanying manuscript Ilinsky et al., 2018, available at the site referenced below. The manuscript also compares them with DTI tractography.
  get:
