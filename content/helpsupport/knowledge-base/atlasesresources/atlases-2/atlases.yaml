  cite:
  - 'Amunts, K., Lepage, C., Borgeat, L., Mohlberg, H., Dickscheid, T., Rousseau, M.-É. et al. (2013). BigBrain: an ultrahigh-resolution 3D human brain model. *Science (New York, NY)*, *340*(6139), 1472–1475. [doi:10.1126/science.1235381](https://doi.org/10.1126/science.1235381)'
  - 'Warp into 2009b space: Xiao, Y., Lau, J. C., Anderson, T., DeKraker, J., Collins, D. L., Peters, T., & Khan, A. R. (2019). Bridging micro and macro: accurate registration of the BigBrain dataset with the MNI PD25 and ICBM152 atlases. *bioRxiv*, *4*, 561118. [doi:10.1101/561118](https://doi.org/10.1101/561118)'
  image: bigbrain.png
