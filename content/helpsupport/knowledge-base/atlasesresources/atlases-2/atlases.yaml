# The atlases on this page, shown by the shortcodes atlas-index (the filter and group links at the top) and atlas-group
# (one group with its entries). One entry per atlas, always in this order:
#   id            the entry's anchor (#id); keep it when editing, links from papers and slides use it
#   also          older anchors that should still land on this entry (optional)
#   group         one of the ids under "groups"
#   name, ref     the atlas and its paper ("Author Year"), shown as "Name (Ref)"
#   covers        a few words: structures, disease or use; shown in the index
#   preinstalled  true if it comes with Lead-DBS; "included" overrides the index column (optional)
#   page          a page of its own on this site (optional)
#   about         a few sentences of Markdown on what it is
#   get           how to get it, one Markdown line each; name the place in the link, never "here"
#   cite          the papers, one Markdown line each (cite_numbered: true for a numbered list)
#   image + alt (+ caption), or clip + poster + alt: the picture, a file next to index.md
groups:
- id: basal-ganglia
  title: Basal ganglia and whole subcortex
  intro: 'Atlases of several deep nuclei at once: the usual starting point for visualizing a DBS target.'
- id: thalamus
  title: Thalamus
  intro: Parcellations of the thalamic nuclei, by histology, structural MRI or connectivity.
- id: nuclei
  title: Single nuclei and the brainstem
  intro: STN, GPi, substantia nigra, zona incerta, nucleus accumbens, PPN and brainstem nuclei.
- id: tracts
  title: Fibre tracts
  intro: Tractography atlases of white-matter pathways that matter for DBS.
- id: dbs-maps
  title: Sweet spots, response tracts and target maps
  intro: 'Maps derived from DBS and lesion outcomes: sweet spots, response tracts, electrophysiological hot spots and target coordinates.'
- id: functional
  title: Functional parcellations
  intro: Parcellations of the subcortex and cerebellum by resting-state functional connectivity.
- id: macaque
  title: Macaque
  intro: 'Lead-DBS localizes electrodes in macaque MRI and CT too (since version 1.4.9): with the macaque toolbox installed, type `lead macaque` in MATLAB. The atlas for it:'
atlases:
- id: distal-atlas-ewert-2018
