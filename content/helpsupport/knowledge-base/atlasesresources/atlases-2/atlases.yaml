  cite:
  - 'Alkemade A, Mulder MJ, Groot JM, Isaacs BR, van Berendonk N, Lute N, Isherwood SJ, Bazin PL, Forstmann BU. The Amsterdam Ultra-high field adult lifespan database (AHEAD): A freely available multimodal 7 Tesla submillimeter magnetic resonance imaging database. Neuroimage. 2020 Nov 1;221:117200. doi: 10.1016/j.neuroimage.2020.117200. Epub 2020 Aug 1. PMID: 32745682. [doi:10.1016/j.neuroimage.2020.117200](https://doi.org/10.1016/j.neuroimage.2020.117200)'
  image: Screen-Shot-2021-03-18-at-15.48.13-300x216.png
  alt: 'AHEAD atlas: subcortical structures in 3D over a coronal MRI slice'
- id: cit168-reinforcement-learning-atlas-pauli-2017
  group: basal-ganglia
  name: CIT168 Reinforcement Learning Atlas
  ref: Pauli 2018
  covers: Main DBS targets and nearby nuclei
  preinstalled: true
  about: Initially built to study structures involved in reinforcement learning processes, this atlas captures all primary DBS targets and structures of interest. Probabilistic atlas based on manual segmentations on HCP data.
