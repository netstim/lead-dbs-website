- id: atlas-of-the-basal-ganglia-and-thalamus-abgt
  group: basal-ganglia
  name: Atlas of the Basal Ganglia and Thalamus (ABGT)
  ref: He 2020
  covers: Basal ganglia and thalamus, structural and functional
  preinstalled: true
  about: This atlas was generated in a hybrid manner using both structural and functional information. Components of the basal ganglia were first defined structurally with the “[atlas of the basal ganglia](https://www.nitrc.org/projects/atag/)” ([ATAG](https://www.nitrc.org/projects/atag/); Keuken et al., 2014), including the striatum, globus pallidus externus (GPe) and internus (GPi), subthalamic nucleus (STN), and substantia nigra (SN). We also localized the spatial extent of the thalamus based on the Morel atlas (Morel et al., 1997; Krauth et al., 2010). Due to the relatively small size of the GPi, GPe, STN, and SN, these components were kept consistent with ATAG without any additional processing. For the striatum and thalamus, we then performed a masked independent component analysis (ICA) based functional parcellation (Moher Alsady et al., 2016) to divide them into functionally distinctive subdivisions.
  get: []
  cite:
  - he2020
  image: He_atlas-1030x730.png
  alt: 'Atlas of the Basal Ganglia and Thalamus: colour-coded parcels in 3D'
- id: morel-atlas
  group: basal-ganglia
  name: Morel atlas
  ref: Morel 2013, Krauth 2010
  covers: Thalamus and basal ganglia from histology
  preinstalled: true
  about: |-
    A histological atlas normalized to MNI space.

    Suited to STN and thalamic targets. The ventral intermediate nucleus (VIM) is not represented separately: this atlas follows Jones / Hirai & Jones nomenclature rather than Walker or Hassler.

    The VLpv is the nucleus of the atlas best corresponding to the VIM although it may not be exactly the same. On conversions between thalamic nomenclatures, see for example Paxinos, G. (2012). The Human Nervous System. Academic Press.
  get:
  - Comes with Lead-DBS; its authors have also made it [openly available](https://zenodo.org/records/13918589)
  - 'A surface-based version: [Morel atlas surfaces in the ETH Research Collection](https://www.research-collection.ethz.ch/handle/20.500.11850/669887)'
  cite:
  - jakab2012
  - krauth2010
  - morel2013
  image: Morel-300x172.png
  alt: 'Morel atlas: thalamic and basal ganglia structures of both hemispheres in 3D'
