  - 'Chakravarty, M. M., Bertrand, G., Hodge, C. P., Sadikot, A. F., & Collins, D. L. (2006). The creation of a brain atlas for image guided neurosurgery using serial histological data. *NeuroImage*, *30*(2), 359–376. [ScienceDirect](http://www.sciencedirect.com/science/article/pii/S1053811905006993)'
