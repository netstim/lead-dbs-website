  alt: 'Allen Human Reference Atlas: subcortical structures in 3D'
- id: ahead-atlas-alkemade-2020
  group: basal-ganglia
  name: AHEAD atlas
  ref: Alkemade 2020
  covers: Basal ganglia from 7T MRI
  preinstalled: true
  about: The AHEAD atlas is a freely available multi-modal, 7 Tesla MRI database. Sub-millimeter resolutions for sub cortical structures were achieved by using multi-echo (ME) extension of the second gradient echo imaging of MPRAGE sequences. The probabilistic atlases of the basal ganglia is based on more than 1000 manual delineations. Data is also made available for further analysis.
