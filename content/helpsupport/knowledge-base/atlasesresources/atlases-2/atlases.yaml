- id: the-allen-human-reference-atlas-ding-2020
  group: basal-ganglia
  name: Allen Human Reference Atlas
  ref: Ding 2020
  covers: Whole brain, 141 structures
  preinstalled: true
  about: The Allen Human Reference Atlas is a parcellation of the adult human brain, labeling every voxel with a brain structure spanning 141 structures. The anatomic structure ontology adapted for use in the atlas was based on the 2016 version of the 2D atlas, published in final form in Ding et al, 2016 and available online in the [BrainSpan reference atlas](http://www.brainspan.org/static/atlas).
  get:
