  about: The HybraPD atlas is constructed by using fused quantitative susceptibility mapping (QSM) and T1w images from 87 patients with PD. It contains a parcellation map with 12 bilateral subcortical nuclei, which are highly related to PD pathology, such as sub-regions in globus pallidus, substantia nigra and subthalamic nucleus etc. Furthermore, a whole-brain parcellation map is achieved by combining existing cortical parcellation and white-matter segmentation with the proposed subcortical nuclei map.
