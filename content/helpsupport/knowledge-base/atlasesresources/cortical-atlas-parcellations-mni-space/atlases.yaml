- id: jubrain--juelich-histological-atlas-eickhoff-2005
  group: histological
  name: JuBrain / Juelich histological atlas
  ref: Eickhoff 2005
  covers: Cyto- and myeloarchitectonic areas
  preinstalled: true
  about: A probabilistic atlas created by averaging multi-subject post-mortem cyto- and myelo-architectonic segmentations, performed by the team of Profs Zilles and Amunts in Jülich and Düsseldorf. Cytoarchitectonic areas were analyzed in histological sections of ten human postmortem brains. The maps are based on image analysis and statistical criteria for localizing areal borders. Cytoarchitectonic maps have been developed during the past 20 years as a joint effort of many doctoral students, post docs and guest scientists. Maps, which have been published, are available for the scientific community.
  get:
  - 'Information: [JuBrain at Forschungszentrum Jülich](http://www.fz-juelich.de/inm/inm-1/EN/Forschung/JuBrain/Jubrain_Webtools/Jubrain_Webtools_node.html)'
  cite:
  - 'Zilles, K., & Amunts, K. (2010). Centenary of Brodmann’s map–conception and fate. *Nature reviews. Neuroscience* (Vol. 11, pp. 139–145). http://doi.org/10.1038/nrn2776. [doi:10.1038/nrn2776](https://doi.org/10.1038/nrn2776)'
