- id: julich-brain-cytoarchitectonic-atlas-amunts-2020
  group: histological
  name: Julich-Brain cytoarchitectonic atlas
  ref: Amunts 2020
  covers: Cytoarchitectonic areas
  preinstalled: true
  about: The Julich-Brain Cytoarchitectonic Atlas presents cytoarchitectonic maps in several coordinate spaces, such as MNI colin27, MNI152, and freesurfer. These maps originate from peer-reviewed probability maps that define both cortical and subcortical brain regions. Notably, these probability maps account for the brain’s inter-individual variability by analyzing data from ten post-mortem samples. For a whole-brain parcellation, the available probability maps are combined into a maximum probability map by considering for each voxel the probability of all cytoarchitectonic brain regions, and determining the most probable assignment. Continuously evolving, the Atlas is regularly updated with new areas. Furthermore, it stands as a reference atlas for the Human Brain Project and is deeply embedded within the European research infrastructure platform, EBRAINS. The *siibra* toolsuite provides an automated access to the Atlas, to speed up your work.
  get:
  - Download most recent version at [EBRAINS Knowledge Graph](https://search.kg.ebrains.eu/?category=Dataset&q=julich%20brain%20brain).
  cite:
  - 'Amunts, K., Mohlberg, H., Bludau, S., & Zilles, K. (2020). Julich-Brain: A 3D probabilistic atlas of the human brain’s cytoarchitecture. Science, 369(6506), 988–992. DOI: 10.1126/science.abb4588. [doi:10.1126/science.abb4588](https://doi.org/10.1126/science.abb4588)'
  image: JulichBrainAtlas-300x235.png
  alt: 'Julich-Brain atlas: colour-coded cytoarchitectonic areas on a brain surface'
