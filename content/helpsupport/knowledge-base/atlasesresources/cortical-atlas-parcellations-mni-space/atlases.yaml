  image: Brodmann-300x227.png
  alt: Brodmann areas in color on a brain surface
- id: julich-brain-cytoarchitectonic-atlas-amunts-2020
  group: histological
  name: Julich-Brain cytoarchitectonic atlas
  ref: Amunts 2020
  covers: Cytoarchitectonic areas
  preinstalled: true
  about: Cytoarchitectonic probability maps of cortical and subcortical regions from ten post-mortem brains, in MNI Colin27, MNI152 and FreeSurfer space. For a whole-brain parcellation, each voxel is assigned to the cytoarchitectonic region with the highest probability, producing a maximum probability map. The atlas is updated with new areas; it served as a reference atlas for the Human Brain Project and is part of EBRAINS. The *siibra* tools give programmatic access to it.
  get:
  - Download most recent version at [EBRAINS Knowledge Graph](https://search.kg.ebrains.eu/?category=Dataset&q=julich%20brain%20brain).
  cite:
