  name: Classical cortical atlases in MRI space
  ref: Pijnenburg 2021
  covers: Six classical atlases (e.g. Brodmann)
  preinstalled: true
  about: Digital versions of six classical human brain atlases in common MRI space. The cortical atlases represent a range of modalities, including cyto- and myeloarchitecture (Campbell, Smith, Brodmann and Von Economo), myelogenesis (Flechsig), and mappings of symptomatic information in relation to the spatial location of brain lesions (Kleist).
  get:
