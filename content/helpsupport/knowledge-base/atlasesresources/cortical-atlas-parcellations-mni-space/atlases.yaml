- id: voxelwise-parcellations-lead-dbs
  group: data-driven
  name: Voxelwise parcellations
  ref: Lead-DBS
  covers: Three voxelwise schemes for connectivity matrices
  preinstalled: true
  about: Three voxel-wise parcellations are supplied with Lead-DBS and have been built to create standardized connectivity matrices that exhibit off-diagonal elements that appear as parallel lines to the main diagonal (inter-hemispheric connections between homologous regions). Three versions (35 thousand, 15 thousand and 8 thousand nodes) are pre-installed within Lead-DBS. Together with advanced normalization algorithms (such as multimodal ANTs defaults and DARTEL pipelines), these connectivity matrices allow for high-definition connectomic analyses in parcellation schemes that are comparable across studies.
  get: []
  cite:
  - Parcellation schemes are not described in a separate publication. Please cite Lead-DBS software including version and webpage to describe the data used in a reproducible fashion.
