- id: voxelwise-parcellations-lead-dbs
  group: data-driven
  name: Voxelwise parcellations
  ref: Lead-DBS
  covers: Three voxelwise schemes for connectivity matrices
  preinstalled: true
  about: Three voxelwise parcellations (35,000, 15,000 and 8,000 nodes) come with Lead-DBS. They give standardized connectivity matrices in which connections between homologous regions of the two hemispheres appear as lines parallel to the main diagonal. Combined with normalization methods such as multimodal ANTs or DARTEL, these schemes support connectomic analyses comparable across studies.
  get: []
  cite_note: "Parcellation schemes are not described in a separate publication. Please cite Lead-DBS software including version and webpage to describe the data used in a reproducible fashion."
  cite:
  - neudorfer2023
  image: voxelwiseleaddbs-289x300.png
  alt: 'Voxelwise parcellation: color gradient on a brain surface'
