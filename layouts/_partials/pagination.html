{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Pages">
  {{ with .Prev }}<a class="btn btn--secondary" href="{{ .URL }}">Newer posts</a>{{ else }}<span></span>{{ end }}
  <span class="pagination__count">Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{ with .Next }}<a class="btn btn--secondary" href="{{ .URL }}">Older posts</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
