{{ $page := .page }}
<ul>
  {{ range .menu }}
    {{ $active := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }}
    <li class="{{ if .HasChildren }}has-children{{ end }}{{ if $active }} active{{ end }}">
      <a href="{{ .URL }}"{{ if strings.HasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ if .HasChildren }}{{ partial "menu.html" (dict "menu" .Children "page" $page) }}{{ end }}
    </li>
  {{ end }}
</ul>
