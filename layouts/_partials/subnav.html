{{ $page := .page }}
<ul>
  {{ range .section.Pages.ByWeight }}
  {{ $here := eq . $page }}
  <li{{ if or $here ($page.IsDescendant .) }} class="is-open"{{ end }}>
    <a href="{{ .RelPermalink }}"{{ if $here }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
    {{ if and .IsSection (or $here ($page.IsDescendant .)) (lt $.depth 2) }}
      {{ partial "subnav.html" (dict "section" . "page" $page "depth" (add $.depth 1)) }}
    {{ end }}
  </li>
  {{ end }}
</ul>
