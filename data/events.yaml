# Events: shown on /events/ (upcoming and past), as "next event" under the home page's hero and in
# the sidebar of inner pages. The site picks the next event itself, so an entry can stay here after
# it is over: it moves to "Past events" on its own.
#
# Fields
#   title         name of the event
#   start         a date (2027-02-11) or a date and time in the event's time zone (2026-11-18T15:00)
#   end           optional: last day (2027-02-12), or the end time (2026-11-18T16:30)
#                 Without it the event counts as over at the end of its start day.
#   timezone      the IANA time zone of start and end, e.g. "Europe/Berlin". The site prints the
#                 zone from it and the date: "15:00 CET", in summer "15:00 CEST".
#   also_in       optional: a second IANA time zone printed after it, e.g. "America/New_York"
#                 gives "15:00 CET (09:00 EST)"; summer and winter time are handled by the site.
#   tz_label      optional, rarely needed: text that replaces the printed zone
#   where         place, or "Online (Zoom)"
#   online        true for an online meeting whose link people receive by registering
#   host          optional: who hosts it
#   text          one or two sentences
#   register_url  optional: the registration page. For an online meeting this is the page where
#                 people leave their email address and receive the meeting link (e.g. Zoom's
#                 /meeting/register/ page). Never put the meeting's own join link here or anywhere
#                 else on the site. While it is empty, an
#                 online event says that registration opens soon and that the link is shared in
#                 the user Slack; an event on site says that details and registration will follow.
#   links         optional: more links, each {label, url}; url is a site path or a full URL
#
# How "upcoming" works: the site is rebuilt every night (.github/workflows/pages.yml), and a few
# lines of script in the page also hide events that are over by the visitor's clock.
events:
  - title: "Lead-DBS Developer Meeting"
    start: "2026-11-18T15:00"
    timezone: "Europe/Berlin"
    also_in: "America/New_York"
    where: "Online (Zoom)"
    online: true
    text: "Monthly, online and open to anyone who wants to contribute or follow the development."
    # Zoom's registration page: people leave their email address and Zoom sends them the link
    register_url: "https://uni-koeln.zoom.us/meeting/register/UiZRfHxiRHyyxCMEM0iSPg"
    links:
      - {label: "Flyer and details", url: "/events/developer-meeting/"}

  - title: "Hands-on Lead-DBS Workshop"
    start: "2027-02-11T09:00"
    end: "2027-02-12"
    timezone: "Europe/Berlin"
    where: "Cologne"
    host: "Institute for Network Stimulation and Uniklinik Köln"
    text: "Two days of hands-on work with Lead-DBS. Participants will be among the first to try the pre-release of Lead-DBS 4.0, rebuilt completely in Python."
    register_url: ""
    links:
      - {label: "Workshop details", url: "/events/hands-on-workshop-2027/"}
      - {label: "Past workshops", url: "/helpsupport/workshops/"}
