    title: "A unified connectomic target for deep brain stimulation in obsessive-compulsive disorder"
    journal: "Nature Communications"
    year: 2020
    figure: "Figure 4"
    doi: "10.1038/s41467-020-16734-3"
    license: "CC BY 4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    modification: "cropped to the top 3D panel (title line and the two scatter plots below removed)"
    shows: "Electrodes from two OCD patient groups with the nerve fibre tracts they reach: red tracts were linked to better improvement, blue tracts to less."

