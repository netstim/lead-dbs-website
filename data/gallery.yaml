# Figures from published papers made with Lead-DBS (or, marked with "tool", its sister tool Lead-OR),
# shown on /gallery/ ("Made with Lead-DBS"),
# in the order listed here. Each entry is one block starting with "- file:"; to drop a figure,
# delete its whole block (and, if you like, its file in static/gallery/).
#
# Every field is printed with the figure; the build stops when a required one is missing. The citation, DOI and licence are attribution requirements
# of CC BY: fill them all. "modification" says how the figure was changed from the published one
# (CC BY requires changes to be stated); "none" prints nothing. "shows" is one plain sentence
# printed under the figure and used as its alt text. The page shows a resized copy; a click opens
# the file itself.
#
# - file: "author2025_fig2.png"          # file name in static/gallery/
#   authors: "Author A et al."
#   title: "Title of the paper"
#   journal: "Journal"
#   year: 2025
#   figure: "Figure 2"
#   doi: "10.xxxx/xxxxx"
#   license: "CC BY 4.0"
#   license_url: "https://creativecommons.org/licenses/by/4.0/"
#   modification: "none"                  # or how it was changed: "cropped to panel a"
#   tool: "Lead-OR"                       # optional: when the figure was made with a sister tool, not Lead-DBS itself
#   shows: "One plain sentence: what the figure shows."
figures:

  - file: "li2020_fig4_top.png"
