# Papers about Lead-DBS, its methods and its tools: the one list. Publications prints all of them
# (shortcode {{% papers %}}); Features, Cite and other pages link single papers with
# {{< paper id >}} ("Ewert 2019") or print the full reference with {{< paper id "full" >}}.
# Add a paper here once, with its DOI checked at doi.org, and it appears everywhere it is used.
#
# Every paper is shown with the same citation box (partial cite-box.html): the reference, its BibTeX
# (the id is the key) and a Copy button.
#
# Fields: short (link text), group (one of the groups below), type (article, the default;
# inproceedings, book, or misc for datasets, software and pages: the BibTeX entry type), authors
# ("Last, F. M., Last, F., & Last, F."; for Publications up to six, then "et al."), year, title,
# journal (for inproceedings the proceedings), edition, publisher, address, volume, issue, pages,
# note (printed after the journal, e.g. "preprint"), doi, url and site (the link of a paper without a
# DOI, and its text, e.g. PubMed), links (further links under the box: {label, url}).
# short, group, authors and title are required; papers
# of a listed group need a journal and a doi; doi is the bare DOI (10.1016/…). Leave out a field you
# do not know. The build stops with the paper's id on a missing or unknown field, a doi in another
# form, or a group that is not listed under groups (Publications would leave the paper out).

groups:
  - id: toolbox
    title: "Lead-DBS"
  - id: methods
