# Papers about Lead-DBS, its methods and its tools: the one list. Publications prints all of them
# (shortcode {{% papers %}}); Features, Cite and other pages link single papers with
# {{< paper id >}} ("Ewert 2019") or print the full reference with {{< paper id "full" >}}.
# Add a paper here once, with its DOI checked at doi.org, and it appears everywhere it is used.
#
# Fields: short (link text), group (one of the groups below), authors (as printed: up to six, then
# "et al."), year, title, journal, volume, issue, pages, doi, note (printed after the journal,
# e.g. "preprint"). short, group, authors, year, title, journal and doi are required; doi is the bare
# DOI (10.1016/…). The build stops with the paper's id on a missing or unknown field, a doi in
# another form, or a group that is not listed under groups (Publications would leave the paper out).

