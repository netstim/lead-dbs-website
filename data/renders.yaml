# The lab's renders (files in assets/images/renders/): what each shows, once for every page that uses it.
# The gallery (/gallery/, which shows the ones content/gallery/_index.md lists, in that order), the Features
# page's tools ({{< tools >}}), chapters ({{% chapter %}}) and capabilities ({{< capability >}}) all read their
# words from here, so curating the gallery cannot break Features. A render a page uses but this file does
# not list stops the build.
#
#   alt:     the alt text, one plain sentence
#   caption: printed under the picture on /gallery/. Say how many patients the picture shows (the BrainDeer
#            renders of 2026-11-10 show nine of the ten Lead Tutor patients; the older analysis pictures
#            show all ten).
renders:
  cohort-hero.jpg:
    alt: "The electrodes of nine Lead Tutor patients converging on the subthalamic nucleus, seen from the right and above, with the internal pallidum and red nucleus over a 7 tesla MRI slice"
    caption: "Nine of the ten Lead Tutor patients: all 18 electrodes in MNI space, converging on the subthalamic nucleus (orange), with the internal pallidum (green) and red nucleus (red)."
  cohort-front.jpg:
    alt: "The same nine patients from the front: two fans of electrodes, one on each side, over a 7 tesla MRI slice"
    caption: "The same nine patients from the front: one fan of electrodes on each side."
  cohort-top.jpg:
    alt: "The nuclei and the nine patients' electrodes seen from above, front at the top, on a 7 tesla MRI slice"
    caption: "Nuclei and electrodes from nine patients over a 7 T MRI slice, viewed from above with anterior at the top."
  lead-closeup.jpg:
    alt: "Close-up of one directional electrode with segmented contacts entering the subthalamic nucleus, the red nucleus behind it"
    caption: "One directional electrode of one of these patients, entering the subthalamic nucleus."
  cohort-black.jpg:
    alt: "The nuclei floating on black, with the electrodes of the nine patients descending into the subthalamic nucleus on both sides"
    caption: "The nine patients' electrodes and the nuclei without the MRI behind them."
  pathway-activation.jpg:
    alt: "Example analysis on the Lead Tutor dataset: two electrodes with their stimulation volumes in blue and the activated fibre pathways in red and white"
    caption: "Example Lead Tutor analysis with illustrative stimulation settings: two electrodes, modelled stimulation volumes (blue) and predicted fibre pathway activation."
  pathway-activation-2.jpg:
    alt: "Close-up of predicted pathway activation in an example Lead Tutor analysis"
    caption: "Close-up of the same analysis."
  fiber-filtering.jpg:
    alt: "Example analysis on the Lead Tutor dataset: fibre tracts coloured by their association with simulated outcome scores"
    caption: "Example fibre filtering analysis in ten Lead Tutor patients using simulated outcome scores. Tracts are coloured by the association between stimulation and greater or lesser improvement."
  fiber-filtering-wide.jpg:
    alt: "Example analysis on the Lead Tutor dataset: the fibre filtering result from a wider angle"
    caption: "The same fibre filtering example from the other side."
