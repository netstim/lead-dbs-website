# The lab's renders (files in assets/images/renders/): what each shows, once for every page that uses it.
# The gallery (/gallery/, which shows the ones content/gallery/_index.md lists, in that order), the Methods
# page's chapters ({{% chapter %}}) and capabilities ({{< capability >}}) all read their
# words from here, so curating the gallery cannot break Features. A render a page uses but this file does
# not list stops the build.
#
#   alt:     the alt text, one plain sentence
#   caption: printed under the picture on /gallery/. Say how many patients the picture shows (the BrainDeer
#            renders of 2026-11-10 show nine of the ten Lead Tutor patients; the older analysis pictures
#            show all ten).
renders:
  cohort-hero.jpg:
    alt: "The electrodes of nine Lead Tutor patients converging on the subthalamic nucleus, seen from the right and above, with the internal pallidum and red nucleus over a 7 tesla MRI slice"
    caption: "Nine Lead Tutor patients: 18 electrodes in MNI space converging on the subthalamic nucleus (orange), with the internal pallidum (green) and red nucleus (red)."
  cohort-front.jpg:
    alt: "The same nine patients from the front: two fans of electrodes, one on each side, over a 7 tesla MRI slice"
    caption: "Nine patients, front view: electrodes in both hemispheres."
  cohort-top.jpg:
    alt: "The nuclei and the nine patients' electrodes seen from above, front at the top, on a 7 tesla MRI slice"
    caption: "Nine patients, top view (anterior at top): nuclei and electrodes over a 7 T MRI slice."
  lead-closeup.jpg:
    alt: "Close-up of one directional electrode with segmented contacts entering the subthalamic nucleus, the red nucleus behind it"
    caption: "A directional electrode entering the subthalamic nucleus."
  cohort-black.jpg:
    alt: "The nuclei floating on black, with the electrodes of the nine patients descending into the subthalamic nucleus on both sides"
    caption: "Nine patients: electrodes and nuclei without the MRI background."
  pathway-activation.jpg:
    alt: "Example analysis on the Lead Tutor dataset: two electrodes with modeled stimulation volumes in blue and predicted fiber pathway activation in red and white"
    caption: "Example Lead Tutor analysis with illustrative settings: modeled stimulation volumes (blue) and predicted fiber pathway activation."
  pathway-activation-2.jpg:
    alt: "Close-up of predicted pathway activation in an example Lead Tutor analysis"
    caption: "Predicted pathway activation, close-up."
  fiber-filtering.jpg:
    alt: "Example analysis on the Lead Tutor dataset: fiber tracts colored by their association with simulated outcome scores"
    caption: "Fiber filtering in ten Lead Tutor patients with simulated outcome scores; tracts are colored by their association with greater or lesser improvement."
  fiber-filtering-wide.jpg:
    alt: "Example analysis on the Lead Tutor dataset: the fiber filtering result from a wider angle"
    caption: "Fiber filtering example, opposite view."
