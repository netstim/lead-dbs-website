# Every form of the site, drawn by layouts/_partials/form.html (shortcodes `form` and `newsletter`).
# A field: name, label (sentence case), type (text, email, textarea), required, autocomplete,
# half (two half fields share a row). Fields are optional unless marked required; the label of an
# optional field says so. No placeholders: the label is the only text of a field.
# offline: what the page shows instead while the site has no form backend (params.formsEnabled = false;
# the GitHub preview shows the form, disabled, with a note). Markdown.
# action: the address the form sends to. Once params.formsEnabled is true, the build stops on a form
# without one.
newsletter:
  submit: Subscribe
  offline: "Until sign-up opens here, release news is posted under [News](/news/) and in its [feed](/news/index.xml)."
  fields:
    - {name: first_name, label: First name, autocomplete: given-name, half: true}
    - {name: last_name, label: Last name, autocomplete: family-name, half: true}
    - {name: email, label: Email, type: email, required: true, autocomplete: email}
downloadfocus:
  offline: "To get FOCUS, write to [mail@andreas-horn.de](mailto:mail@andreas-horn.de) with your name and institution."
  # the FOCUS atlas (academic research only); downloading also subscribes to the newsletter
  submit: Download FOCUS
  fields:
    - {name: first_name, label: First name, autocomplete: given-name, half: true}
    - {name: last_name, label: Last name, autocomplete: family-name, half: true}
    - {name: institution, label: Institution, autocomplete: organization}
    - {name: email, label: Email, type: email, required: true, autocomplete: email}
contact:
  submit: Send message
  offline: "Write to [mail@andreas-horn.de](mailto:mail@andreas-horn.de)."
  fields:
    - {name: name, label: Name, required: true, autocomplete: name, half: true}
    - {name: email, label: Email, type: email, required: true, autocomplete: email, half: true}
    - {name: message, label: Message, type: textarea, required: true}
