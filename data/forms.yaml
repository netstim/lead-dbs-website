# Forms carried over from the WordPress site (Ninja Forms). Rendered by the `form` shortcode.
download:
  submit: Download
  fields:
    - {name: first_name, label: First Name, autocomplete: given-name}
    - {name: last_name, label: Last Name, autocomplete: family-name}
    - {name: institution, label: Institution, autocomplete: organization}
    - {name: referral, label: Where did you hear about Lead-DBS?}
    - {name: email, label: Email, type: email, required: true, autocomplete: email}
downloadfocus:
  submit: Send Download Link
  fields:
    - {name: first_name, label: First Name, required: true, autocomplete: given-name}
    - {name: last_name, label: Last Name, required: true, autocomplete: family-name}
    - {name: institution, label: Institution, required: true, autocomplete: organization}
    - {name: referral, label: Where did you hear about FOCUS?}
    - {name: email, label: Email, type: email, required: true, autocomplete: email}
contact:
  submit: Submit
  fields:
    - {name: name, label: Name, required: true, autocomplete: name}
    - {name: email, label: Email, type: email, required: true, autocomplete: email}
    - {name: message, label: Message, type: textarea, required: true}
